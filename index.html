                      <span class="skill-chip-level">Intermedio</span>
                    </div>
                  </div>
                  <div class="skill-chip">
                    <img src="assets/images/colab.png" alt="Google Colab" loading="lazy">

                <!-- Panel 2: Proyectos -->

                  <div class="project-mini-card">

            id: 'contacto',
            label: '03 · Contacto',
            still: 'assets/images/image_4.jpg',
            clip: 'assets/videos/escena_3.mp4',
            accent: '#00f0ff',
            scroll: 2.2,
            eyebrow: 'El Portal de Conexión',

            body: 'Llegamos al final del viaje. Si estás buscando a alguien con determinación, capacidad analítica y pasión por generar valor a través de los datos, estoy lista para el desafío.',

      // Interactive Tab Switcher Helper
      window.switchEcoTab = function (tabName) {
        const skillsPanel = document.getElementById('tab-skills-panel');
        const projectsPanel = document.getElementById('tab-projects-panel');
        const buttons = document.querySelectorAll('.eco-tab-btn');

        if (!skillsPanel || !projectsPanel) return;

        if (tabName === 'skills') {
          skillsPanel.style.display = 'grid';
          projectsPanel.style.display = 'none';
          buttons[0]?.classList.add('is-active');
          buttons[1]?.classList.remove('is-active');
        } else {
          skillsPanel.style.display = 'none';
          projectsPanel.style.display = 'grid';
          buttons[0]?.classList.remove('is-active');
          buttons[1]?.classList.add('is-active');
        }
      };

      // Jump to contact section
      window.jumpToContact = function () {
        const track = document.querySelector('.sw-track');
        if (track) {
          window.scrollTo({
            top: track.scrollHeight,
            behavior: 'smooth'
          });
        }
      };
    });
  </script>
</body>

</html>
